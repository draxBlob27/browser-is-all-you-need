[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-is-all-you-need"
version = "0.1.0"
description = "Aider benchmark-aligned C++ task specifications and audit evidence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
[tool.hatch.build.targets.wheel]
packages = ["src/w8_biayn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
